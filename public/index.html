<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A_77-System | Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0e14;
      --card-bg: #151921;
      --accent: #5865f2;
      --text-main: #f2f3f5;
      --text-muted: #949ba4;
      --border-color: #2b2d31;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'gg sans', 'Noto Sans', sans-serif;
    }
    .navbar {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
    }
    .sidebar {
      background-color: var(--card-bg);
      border-right: 1px solid var(--border-color);
      min-height: calc(100vh - 56px);
    }
    .nav-link {
      color: var(--text-muted);
      border-radius: 8px;
      margin-bottom: 4px;
    }
    .nav-link:hover, .nav-link.active {
      color: #fff;
      background-color: rgba(88, 101, 242, 0.15);
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-main);
    }
    .stat-card {
      padding: 20px;
    }
    .badge-online {
      background-color: #23a55a;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark px-3">
    <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-robot text-primary me-2"></i>A_77-System</a>
    <span class="badge badge-online ms-2"><i class="fa-solid fa-circle me-1" style="font-size: 8px;"></i>Online v2.4.1</span>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <div class="col-md-2 sidebar p-3">
        <ul class="nav nav-pills flex-column">
          <li class="nav-item"><a href="#" class="nav-link active"><i class="fa-solid fa-chart-pie me-2"></i>Overview</a></li>
          <li class="nav-item"><a href="#" class="nav-link"><i class="fa-solid fa-terminal me-2"></i>Commands</a></li>
          <li class="nav-item"><a href="#" class="nav-link"><i class="fa-solid fa-sliders me-2"></i>Settings</a></li>
        </ul>
      </div>
      <div class="col-md-10 p-4">
        <h2>Bot Overview & Stats</h2>
        <p class="text-muted">Live status and quick controls for your bot.</p>
        <div class="row g-3 mt-2">
          <div class="col-md-4">
            <div class="card stat-card">
              <span class="text-muted">Total Servers</span>
              <h3 id="serversCount">--</h3>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card stat-card">
              <span class="text-muted">Total Users</span>
              <h3 id="usersCount">--</h3>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card stat-card">
              <span class="text-muted">Authorized Users</span>
              <h3 id="authUsersCount">--</h3>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function loadStats() {
      try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        document.getElementById('serversCount').innerText = data.guilds || 0;
        document.getElementById('usersCount').innerText = data.users || 0;
        document.getElementById('authUsersCount').innerText = data.authUsers || 0;
      } catch (e) {
        console.error("Error loading stats", e);
      }
    }
    loadStats();
    setInterval(loadStats, 10000);
  </script>
</body>
</html>
